# CRE project settings: RPCs for the chains the workflow reads from and writes to.
# Polygon mainnet is read only (eth_call at the last finalized block); writes go to Sepolia testnet.
staging-settings:
  rpcs:
    - chain-name: polygon-mainnet
      url: https://polygon-bor-rpc.publicnode.com
    - chain-name: ethereum-testnet-sepolia
      url: https://ethereum-sepolia-rpc.publicnode.com

production-settings:
  rpcs:
    - chain-name: polygon-mainnet
      url: https://polygon-bor-rpc.publicnode.com
    - chain-name: ethereum-testnet-sepolia
      url: https://ethereum-sepolia-rpc.publicnode.com
